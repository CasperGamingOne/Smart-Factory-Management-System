name: Generate Readme

on:
  push:
    branches:
      - new-tui-frontend
  pull_request:
    branches:
      - new-tui-frontend
  workflow_dispatch:

permissions:
  contents: write # Required to allow the action to commit the generated README.md

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Readme
        uses: bitflight-devops/github-action-readme-generator@v1
        with:
          readme: 'README.md'
          save: 'true'
          pretty: 'true'
        env:
          # The plugin expects the token via an environment variable, 
          # not a 'with' input.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
