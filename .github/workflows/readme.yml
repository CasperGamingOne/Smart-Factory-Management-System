name: Generate Readme

on:
  push:
    branches:
      - new-tui-frontend
  pull_request:
    branches:
      - new-tui-frontend
  workflow_dispatch:

permissions:
  contents: write # Required to allow the action to commit the generated README.md

jobs:
  update-readme:
    name: Auto-Generate README
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch tags and version history for the generator

      - name: Run Readme Generator Plugin
        uses: bitflight-devops/github-action-readme-generator@v1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          # Only include valid inputs. 
          # Remove 'action', 'path', 'github_token', etc.
          readme: 'README.md'
          save: true
          pretty: true
          versioning_enabled: false
