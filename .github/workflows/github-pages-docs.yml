name: Generate and Deploy GitHub Pages Docs

on:
  push:
    branches: [ main, new-tui-frontend ]
  workflow_dispatch: # Permite rularea manuală din GitHub

permissions:
  contents: write

# Prevents multiple deployments from running at the exact same time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Documentation Generator
        run: |
          mkdir -p docs
          python scripts/generate_docs.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "docs: auto-generated UML and Class Map"
