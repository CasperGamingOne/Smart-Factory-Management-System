name: Generate and Deploy Architecture Map

on:
  push:
    branches:
      - main
      - new-tui-frontend
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' # Pinned for deterministic behavior

      - name: Prepare Documentation Directory
        run: mkdir -p docs # Defensive creation

      - name: Run Documentation Generator
        run: |
          python scripts/generate_docs.py
          
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
