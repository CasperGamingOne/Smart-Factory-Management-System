name: Build and Release Executables

# This triggers the workflow ONLY when you push a tag that starts with 'v' (e.g., v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  analyze-and-release:
    name: Analyze Code and Build Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write # Strictly required to allow GitHub Actions to create the Release page

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for all tags and branches

      - name: ⚙️ Setup .NET Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Ensure this matches your project's target framework

      - name: 📦 Restore Dependencies
        run: dotnet restore Smart-Factory-Management-System.slnx

      # "After analyzing perfectly the repo" - We ensure it compiles without warnings/errors first
      - name: 🔍 Code Analysis & Validation
        run: |
          echo "Running rigorous structural analysis..."
          dotnet build UI/UI.csproj --no-restore --configuration Release -warnaserror
          
          # If you set up Qodana or a Testing project earlier, you can execute it here:
          # dotnet test --no-build --verbosity normal

      - name: 🪟 Publish Windows Executable (Self-Contained)
        run: >
          dotnet publish UI/UI.csproj 
          -c Release 
          -r win-x64 
          --self-contained true 
          -p:PublishSingleFile=true 
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/windows

      - name: 🐧 Publish Linux Executable (Self-Contained)
        run: >
          dotnet publish UI/UI.csproj
          -c Release 
          -r linux-x64 
          --self-contained true 
          -p:PublishSingleFile=true 
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/linux

      - name: 🗜️ Compress Artifacts
        run: |
          # Zip the executables so they are easy to download from the GitHub Releases page
          zip -j windows-smart-factory.zip ./publish/windows/*
          zip -j linux-smart-factory.zip ./publish/linux/*

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Smart Factory Release ${{ github.ref_name }}
          generate_release_notes: true # Auto-generates changelog based on your PRs!
          files: |
            windows-smart-factory.zip
            linux-smart-factory.zip
