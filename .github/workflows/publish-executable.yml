name: Publish Executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish self-contained executable
        run: |
          dotnet publish Smart-Factory-Management-System.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/linux-x64

      - name: Package Linux release asset
        run: |
          cd ./publish/linux-x64
          zip -r ../smart-factory-management-system-linux-x64.zip .

      - name: Publish Windows executable
        run: |
          dotnet publish Smart-Factory-Management-System.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/win-x64

      - name: Package Windows release asset
        run: |
          cd ./publish/win-x64
          zip -r ../smart-factory-management-system-win-x64.zip .

      - name: Upload Linux published artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-factory-management-system-linux-x64
          path: ./publish/linux-x64/

      - name: Upload Windows published artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-factory-management-system-win-x64
          path: ./publish/win-x64/

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./publish/smart-factory-management-system-linux-x64.zip
            ./publish/smart-factory-management-system-win-x64.zip